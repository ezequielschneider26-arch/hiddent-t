<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A8A92"/>
      <stop offset="50%" stop-color="#A8A8B0"/>
      <stop offset="100%" stop-color="#8A8A92"/>
    </linearGradient>
  </defs>
  <!-- Wallet body - folded -->
  <rect x="60" y="150" width="280" height="200" rx="10" fill="url(#bodyG)"/>
  <rect x="65" y="155" width="270" height="190" rx="8" fill="url(#bodyG)" opacity="0.4"/>
  <!-- Fold line -->
  <line x1="60" y1="250" x2="340" y2="250" stroke="#5A5A62" stroke-width="3"/>
  <!-- Snap closure -->
  <circle cx="200" cy="165" r="10" fill="#B8860B"/>
  <circle cx="200" cy="165" r="5" fill="#D4A017"/>
  <!-- Card slots (top half) -->
  <rect x="100" y="180" width="100" height="8" rx="2" fill="#6A6A72"/>
  <rect x="100" y="196" width="80" height="8" rx="2" fill="#6A6A72"/>
  <rect x="100" y="212" width="90" height="8" rx="2" fill="#6A6A72"/>
  <!-- Bottom card slot -->
  <rect x="100" y="270" width="110" height="8" rx="2" fill="#6A6A72"/>
  <!-- Stitching -->
  <path d="M75 345 L200 345 L325 345" stroke="#5A5A62" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M75 160 L200 160 L325 160" stroke="#5A5A62" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M65 250 L335 250" stroke="#5A5A62" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
