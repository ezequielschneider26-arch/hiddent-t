<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <!-- Wallet body - folded -->
  <rect x="60" y="150" width="280" height="200" rx="10" fill="#2A2A2E"/>
  <rect x="65" y="155" width="270" height="190" rx="8" fill="#3A3A40"/>
  <!-- Fold line -->
  <line x1="60" y1="250" x2="340" y2="250" stroke="#2A2A2E" stroke-width="3"/>
  <!-- Snap closure -->
  <circle cx="200" cy="165" r="10" fill="#777"/>
  <circle cx="200" cy="165" r="5" fill="#555"/>
  <!-- Card slots (top half) -->
  <rect x="100" y="180" width="100" height="8" rx="2" fill="#333338"/>
  <rect x="100" y="196" width="80" height="8" rx="2" fill="#333338"/>
  <rect x="100" y="212" width="90" height="8" rx="2" fill="#333338"/>
  <!-- Stitching -->
  <path d="M75 345 L200 345 L325 345" stroke="#2A2A2E" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M75 160 L200 160 L325 160" stroke="#2A2A2E" stroke-width="1.5" stroke-dasharray="4,4"/>
</svg>
