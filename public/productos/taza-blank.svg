<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8E8EA"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E2E6"/>
    </linearGradient>
    <linearGradient id="handleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E2E2E6"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDDDE2"/>
    </linearGradient>
    <linearGradient id="rimG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8EA"/>
    </linearGradient>
  </defs>
  <!-- Mug body (slightly tapered cylinder) -->
  <path d="M95 150 L305 150 L292 400 Q290 420 270 420 L130 420 Q110 420 108 400 Z" fill="url(#bodyG)"/>
  <!-- Rim / inner -->
  <ellipse cx="200" cy="150" rx="105" ry="20" fill="url(#rimG)"/>
  <ellipse cx="200" cy="150" rx="88" ry="14" fill="#D6D6DA"/>
  <!-- Bottom ellipse -->
  <path d="M120 420 Q200 436 280 420 Q200 436 120 420 Z" fill="#E2E2E6"/>
  <!-- Handle -->
  <path d="M305 190 Q360 190 360 260 Q360 330 305 330" stroke="url(#handleG)" stroke-width="34" fill="none" stroke-linecap="round"/>
  <!-- Subtle shadow on left side of body -->
  <path d="M95 150 L118 420 Q150 425 130 400 L108 150 Z" fill="#D8D8DC" opacity="0.5"/>
  <!-- Print zone highlight (sublimation area) -->
  <rect x="150" y="175" width="100" height="220" fill="#FFFFFF" opacity="0.35"/>
</svg>
