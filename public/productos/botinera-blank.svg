<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A8A92"/>
      <stop offset="50%" stop-color="#A8A8B0"/>
      <stop offset="100%" stop-color="#8A8A92"/>
    </linearGradient>
  </defs>
  <!-- Horizontal bag body -->
  <rect x="30" y="160" width="340" height="180" rx="16" fill="url(#bodyG)"/>
  <rect x="36" y="166" width="328" height="168" rx="12" fill="url(#bodyG)" opacity="0.4"/>
  <!-- Top zipper -->
  <path d="M50 185 Q200 175 350 185" stroke="#5A5A62" stroke-width="3" fill="none"/>
  <circle cx="335" cy="188" r="6" fill="#B8860B"/>
  <circle cx="335" cy="188" r="3" fill="#D4A017"/>
  <!-- Side handles -->
  <path d="M35 220 Q15 220 15 250 Q15 280 35 280" stroke="#6A6A72" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M365 220 Q385 220 385 250 Q385 280 365 280" stroke="#6A6A72" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- D-rings -->
  <circle cx="40" cy="250" r="8" fill="none" stroke="#B8860B" stroke-width="3"/>
  <circle cx="360" cy="250" r="8" fill="none" stroke="#B8860B" stroke-width="3"/>
  <!-- Bottom -->
  <rect x="35" y="325" width="330" height="12" rx="3" fill="#6A6A72"/>
  <!-- Stitching -->
  <path d="M50 320 L200 320 L350 320" stroke="#5A5A62" stroke-width="1.5" stroke-dasharray="4,4"/>
</svg>
