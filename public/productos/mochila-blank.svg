<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A8A92"/>
      <stop offset="50%" stop-color="#A8A8B0"/>
      <stop offset="100%" stop-color="#8A8A92"/>
    </linearGradient>
    <linearGradient id="pocketG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A9AA2"/>
      <stop offset="50%" stop-color="#B4B4BC"/>
      <stop offset="100%" stop-color="#9A9AA2"/>
    </linearGradient>
  </defs>
  <!-- Backpack body -->
  <rect x="80" y="80" width="240" height="340" rx="20" fill="url(#bodyG)"/>
  <rect x="86" y="86" width="228" height="328" rx="16" fill="url(#bodyG)" opacity="0.35"/>
  <!-- Side shading -->
  <path d="M80 120 Q80 80 120 80 L100 80 Q80 80 80 100 Z" fill="#6A6A72"/>
  <path d="M320 120 Q320 80 280 80 L300 80 Q320 80 320 100 Z" fill="#6A6A72"/>
  <!-- Main compartment zipper -->
  <path d="M100 120 Q200 100 300 120" stroke="#5A5A62" stroke-width="3" fill="none"/>
  <rect x="96" y="112" width="8" height="8" fill="#77777E"/>
  <rect x="296" y="112" width="8" height="8" fill="#77777E"/>
  <circle cx="280" cy="125" r="6" fill="#B8860B"/>
  <circle cx="280" cy="125" r="3" fill="#D4A017"/>
  <!-- Front pocket -->
  <rect x="110" y="220" width="180" height="140" rx="12" fill="url(#pocketG)"/>
  <rect x="114" y="224" width="172" height="132" rx="10" fill="url(#pocketG)" opacity="0.45"/>
  <!-- Pocket zipper -->
  <path d="M120 250 Q200 240 280 250" stroke="#5A5A62" stroke-width="2.5" fill="none"/>
  <circle cx="265" cy="253" r="5" fill="#B8860B"/>
  <circle cx="265" cy="253" r="2.5" fill="#D4A017"/>
  <!-- Pocket bottom stitching -->
  <path d="M118 348 Q200 352 282 348" stroke="#5A5A62" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Stitching around pocket -->
  <path d="M116 226 Q200 220 284 226 L284 344 Q200 352 116 344 Z" stroke="#5A5A62" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
  <!-- Shoulder straps -->
  <path d="M130 80 Q120 60 110 80 L110 350 Q120 370 130 350" fill="#6A6A72"/>
  <path d="M270 80 Q280 60 290 80 L290 350 Q280 370 270 350" fill="#6A6A72"/>
  <!-- Top handle -->
  <path d="M170 80 Q200 50 230 80" stroke="#6A6A72" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Bottom reinforcement -->
  <rect x="85" y="395" width="230" height="20" rx="4" fill="#6A6A72"/>
  <!-- Side piping -->
  <line x1="85" y1="100" x2="85" y2="390" stroke="#5A5A62" stroke-width="4"/>
  <line x1="315" y1="100" x2="315" y2="390" stroke="#5A5A62" stroke-width="4"/>
</svg>
